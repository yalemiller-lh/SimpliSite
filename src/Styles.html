<style>
  :root {
    color-scheme: light;
    --background: #f7f8fa;
    --surface: #ffffff;
    --text: #172033;
    --muted: #637083;
    --border: #d9dee7;
    --accent: #2958a5;
    --accent-soft: #eaf1fb;
    --danger: #9b1c1c;
    --danger-soft: #fff0f0;
    font-family: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
  }

  .shell {
    width: min(900px, calc(100% - 32px));
    margin-inline: auto;
  }

  .site-header {
    padding: 56px 0 44px;
    background: linear-gradient(135deg, #17345f, #2958a5);
    color: #ffffff;
  }

  .eyebrow {
    margin: 0 0 8px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.82;
  }

  h1, h2, p { margin-top: 0; }
  h1 { margin-bottom: 10px; font-size: clamp(2rem, 6vw, 3.5rem); }
  h2 { margin-bottom: 4px; font-size: 1.55rem; }
  .lede { margin-bottom: 0; font-size: 1.05rem; opacity: 0.9; }

  main { padding-block: 42px 64px; }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 18px;
  }

  .muted { margin-bottom: 0; color: var(--muted); }

  .secondary-button {
    min-height: 42px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--accent);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  .secondary-button:hover { background: var(--accent-soft); }
  .secondary-button:focus-visible { outline: 3px solid #7aa7e8; outline-offset: 2px; }
  .secondary-button:disabled { cursor: wait; opacity: 0.65; }

  .status {
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--muted);
  }

  .status.error {
    border-color: #efb2b2;
    background: var(--danger-soft);
    color: var(--danger);
  }

  .document-list {
    display: grid;
    gap: 14px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .document-card {
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(23, 32, 51, 0.05);
  }

  .document-card h3 { margin: 0 0 8px; font-size: 1.15rem; }
  .document-card p { margin-bottom: 12px; color: var(--muted); line-height: 1.55; }

  .document-type {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 700;
  }

  .site-footer {
    padding: 24px 0;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }

  @media (max-width: 560px) {
    .site-header { padding: 42px 0 34px; }
    .section-heading { align-items: flex-start; }
    .document-card { padding: 18px; }
  }
</style>
